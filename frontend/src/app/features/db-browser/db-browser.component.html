<div class="db-browser">
  <h2>Database Browser</h2>

  <div class="columns">
    <div class="left">
      <h3>Tables</h3>
      <div *ngIf="loadingTables">Loading tables...</div>
      <ul>
        <li *ngFor="let t of tables" (click)="selectTable(t.table_name)" [class.selected]="t.table_name === selectedTable">
          {{ t.table_name }} <small class="muted">({{ t.table_rows }} rows)</small>
        </li>
      </ul>
    </div>

    <div class="right">
      <h3 *ngIf="selectedTable">Table: {{ selectedTable }}</h3>
      <div *ngIf="!selectedTable">Select a table to view rows</div>

      <div *ngIf="loadingRows">Loading rows...</div>

      <div *ngIf="rows && rows.length">
        <table>
          <thead>
            <tr>
              <th *ngFor="let c of (rows[0] | keyvalue)">{{ c.key }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of rows">
              <td *ngFor="let c of (r | keyvalue)">{{ c.value }}</td>
            </tr>
          </tbody>
        </table>

        <div class="pager">
          <button (click)="prevPage()" [disabled]="offset === 0">Previous</button>
          <button (click)="nextPage()" [disabled]="offset + limit >= total">Next</button>
          <span class="muted">Showing {{ offset + 1 }} - {{ offset + rows.length }} of {{ total }}</span>
        </div>
      </div>

      <div *ngIf="rows && rows.length === 0 && selectedTable && !loadingRows">No rows found.</div>
    </div>
  </div>
</div>
