<header class="header">
  <div class="header-container">
    <div class="header-start">
      <button class="hamburger-btn" (click)="toggleSidebar()" title="Toggle Sidebar">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="logo-section">
        <div class="logo-icon">VI</div>
        <div class="logo-text">
          <h1>Vishwaguru Infotech Pvt Ltd</h1>
          <p>CEO Dashboard</p>
        </div>
      </div>
    </div>
    
    <div class="header-center">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M7 13C10.3137 13 13 10.3137 13 7C13 3.68629 10.3137 1 7 1C3.68629 1 1 3.68629 1 7C1 10.3137 3.68629 13 7 13Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 15L11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="text" placeholder="Search by project, client, or squad">
      </div>
    </div>
    
    <div class="header-right">
      <button class="header-icon-btn" title="Notifications">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
      <button class="header-icon-btn" title="Profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </div>
  </div>
</header>
