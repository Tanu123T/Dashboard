<nav class="navbar" [class.hidden]="!sidebarVisible">
  <div class="nav-menu">
    <!-- Overview Group -->
    <div class="nav-group" [class.open]="overviewMenuOpen">
      <div class="nav-item" [class.active]="isTabActive('overview')" (click)="activateOverviewTab($event)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Overview</span>
        <button class="chevron-btn" (click)="toggleOverviewMenu($event)">
          <svg *ngIf="overviewMenuOpen" class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
          <svg *ngIf="!overviewMenuOpen" class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
      <div class="nav-submenu" *ngIf="overviewMenuOpen">
        <a *ngFor="let item of overviewSubMenus" [routerLink]="item.route" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active" class="nav-subitem">
          {{ item.label }}
        </a>
      </div>
    </div>

    <!-- Execution Group -->
    <div class="nav-group" [class.open]="executionMenuOpen">
      <div class="nav-item" [class.active]="isTabActive('execution')" (click)="activateExecutionTab($event)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
        <span>Execution</span>
        <button class="chevron-btn" (click)="toggleExecutionMenu($event)">
          <svg *ngIf="executionMenuOpen" class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
          <svg *ngIf="!executionMenuOpen" class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
      <div class="nav-submenu" *ngIf="executionMenuOpen">
        <a *ngFor="let item of executionSubMenus" [routerLink]="item.route" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active" class="nav-subitem">
          {{ item.label }}
        </a>
      </div>
    </div>

    <!-- People Health Group -->
    <div class="nav-group" [class.open]="peopleHealthMenuOpen">
      <div class="nav-item" [class.active]="isTabActive('people')" (click)="activatePeopleHealthTab($event)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>People Health</span>
        <button class="chevron-btn" (click)="togglePeopleHealthMenu($event)">
          <svg *ngIf="peopleHealthMenuOpen" class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
          <svg *ngIf="!peopleHealthMenuOpen" class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
      <div class="nav-submenu" *ngIf="peopleHealthMenuOpen">
        <a *ngFor="let item of peopleHealthSubMenus" [routerLink]="item.route" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active" class="nav-subitem">
          {{ item.label }}
        </a>
      </div>
    </div>
  </div>

  <div class="bottom-menu">
    <button class="nav-item" (click)="handleSettings()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"></path>
      </svg>
      <span>Settings</span>
    </button>
    <button class="nav-item" (click)="handleLogout()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Log out</span>
    </button>
  </div>
</nav>
